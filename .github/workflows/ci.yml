name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep matplotlib headless and deterministic on the runner.
  MPLBACKEND: Agg
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Lint (new code — gating)
        # The legacy tree carries ~683 pre-existing ruff findings; fixing them is
        # a large mechanical diff that does not belong on the resubmission's
        # critical path. Gate the CLI package and the tests written against it so
        # new code cannot add to the pile, and clear the backlog after the paper.
        run: uv run ruff check src/plm_choice

      - name: Lint (whole repo — informational)
        continue-on-error: true
        run: uv run ruff check src scripts tests --statistics

      - name: Install the locked environment
        run: uv sync --locked
        env:
          # CPU-only torch keeps the runner image well under the disk limit;
          # nothing in the default test scope needs CUDA.
          UV_TORCH_BACKEND: cpu

      - name: Verify the package imports as installed
        # Guards the src-layout wheel mapping: these are the names the code
        # imports itself by, so if this breaks the console script breaks too.
        run: |
          cd "$(mktemp -d)"
          uv run --project "$GITHUB_WORKSPACE" python -c "
          import evaluation, training, visualization, data_preparation, shared, plm_choice
          print('first-party imports OK')
          "

      - name: Smoke-test the CLI
        run: |
          uv run plm --version
          uv run plm --help
          uv run plm stages

      - name: Run the test suite
        # Integration tests skip themselves (no GPU, no bulk data on a runner);
        # `slow` deselects the statistical coverage simulations, which take
        # minutes and are run on demand rather than per push.
        run: uv run pytest -q -m "not slow"

  slow:
    name: slow statistical simulations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Coverage simulations are expensive; run them on main and on demand only.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --locked
        env:
          UV_TORCH_BACKEND: cpu

      - name: Run the slow suite
        run: uv run pytest -q -m slow
